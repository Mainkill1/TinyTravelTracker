name: Cache scheduling regressions
on: [push, pull_request]
permissions:
  contents: read
jobs:
  host-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - run: scripts/test-cache-scheduling.sh
