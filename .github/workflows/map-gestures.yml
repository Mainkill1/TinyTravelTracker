name: Map gesture regressions
on: [push, pull_request]
permissions:
  contents: read
jobs:
  host-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: scripts/test-map-gestures.sh
