name: Android APK
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install JDK for SDK manager
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17.0.17+10'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-26 build-tools;28.0.3'
          log-accepted-android-sdk-licenses: false
      - name: Install JDK for Gradle 5.1.1
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '8.0.504+1'
      - run: scripts/fetch-tangram.sh
      - run: ./gradlew --no-daemon clean assembleDebug testDebugUnitTest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tiny-travel-tracker-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
