name: Collector recovery regressions
on: [push, pull_request]
permissions:
  contents: read
jobs:
  host-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: scripts/test-collector-recovery.sh
