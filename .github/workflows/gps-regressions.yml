name: GPS and battery regressions
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: scripts/test-gps-regressions.sh
