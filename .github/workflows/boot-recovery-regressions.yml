name: Boot recovery regressions

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  boot-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: scripts/test-boot-recovery.sh
