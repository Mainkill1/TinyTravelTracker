// Fail before compilation if the separately fetched release artifact is missing or changed.
def tangramAar = rootProject.file('.dependencies/tangram-android-0.10.1.aar')
if (!tangramAar.isFile()) {
    throw new GradleException('Run scripts/fetch-tangram.sh before building (see BUILDING.md).')
}
def tangramSha256 = java.security.MessageDigest.getInstance('SHA-256')
        .digest(tangramAar.bytes).encodeHex().toString()
if (tangramSha256 != '88ef5803f006bb5e1d84409f615dddb034bbd7afe8b9e5681053b43725439c14') {
    throw new GradleException('Tangram AAR checksum mismatch; remove it and run scripts/fetch-tangram.sh.')
}

apply plugin: 'com.android.application'

android {
    compileSdkVersion 26
    defaultConfig {
        applicationId "com.rareventure.gps2"
        minSdkVersion 21
        targetSdkVersion 26
        versionCode 93
        versionName "1.1.49-alpha.2"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    lintOptions {
        abortOnError false
        checkReleaseBuilds false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildToolsVersion '28.0.3'
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'com.android.support:appcompat-v7:26.1.0'
    implementation 'com.android.support:support-compat:26.1.0'
    implementation 'ch.acra:acra:4.9.1'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'com.android.support.test:runner:1.0.1'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.1'
    // co: This causes a strange problem where I get:
    // java.lang.SecurityException: Neither user nor current process has android.permission WAKE_LOCK
    // I tried asking for the permission, but it causes an infinite loop
    // I think because it uses the new 27 appcompat target library and that is causing
    // some problems
    //    def acraVersion = '5.1.3'
    //    implementation "ch.acra:acra-mail:$acraVersion"
    //    implementation "ch.acra:acra-limiter:$acraVersion"
    // Official same-version release AAR; see scripts/fetch-tangram.sh and BUILDING.md.
    implementation files(rootProject.file('.dependencies/tangram-android-0.10.1.aar'))
    // Local AARs have no POM, so retain the dependencies declared by upstream 0.10.1.
    implementation 'com.squareup.okhttp3:okhttp:3.12.0'
    implementation 'com.android.support:support-annotations:27.1.1'
    implementation 'com.github.tajchert:nammu:1.2.0'
    //this is for asking the user for permissions
}
