// Fail before compilation if the separately fetched release artifact is missing or changed.
def tangramAar = rootProject.file('.dependencies/tangram-android-0.10.1.aar')
if (!tangramAar.isFile()) {
    throw new GradleException('Run scripts/fetch-tangram.sh before building (see BUILDING.md).')
}
def tangramSha256 = java.security.MessageDigest.getInstance('SHA-256')
        .digest(tangramAar.bytes).encodeHex().toString()
if (tangramSha256 != '88ef5803f006bb5e1d84409f615dddb034bbd7afe8b9e5681053b43725439c14') {
    throw new GradleException('Tangram AAR checksum mismatch; remove it and run scripts/fetch-tangram.sh.')
}

apply plugin: 'com.android.application'

android {
    namespace "com.rareventure.gps2"
    compileSdk 36
    defaultConfig {
        applicationId "com.rareventure.gps2"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode 93
        versionName "1.1.49-alpha.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildFeatures {
        buildConfig true
        aidl true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    lintOptions {
        abortOnError false
        checkReleaseBuilds false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildToolsVersion "35.0.0"
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'ch.acra:acra:4.9.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    // Official same-version release AAR; see scripts/fetch-tangram.sh and BUILDING.md.
    implementation files(rootProject.file('.dependencies/tangram-android-0.10.1.aar'))
    // Local AARs have no POM, so retain the dependencies declared by upstream 0.10.1.
    implementation 'com.squareup.okhttp3:okhttp:3.12.0'
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'com.github.tajchert:nammu:1.2.0'
    //this is for asking the user for permissions
}
